openapi: 3.0.3
info:
  title: Aali Market API
  description: >
    Price-first mobile shopping API for small-town India. All money fields
    are integer paise. Bilingual user-facing text is `{ en, hi }`.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Catalog
  - name: Cart
  - name: Addresses
  - name: Orders
  - name: Payments
  - name: Reviews
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Bilingual:
      type: object
      properties:
        en: { type: string }
        hi: { type: string }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true, example: null }
        error:
          type: object
          properties:
            code: { type: string, example: 'OTP_EXPIRED' }
            message: { type: string }
            details: { type: array, items: { type: object }, nullable: true }

    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        error: { nullable: true, example: null }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string, example: Home }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, example: '110001' }
        isDefault: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: string }
        title: { $ref: '#/components/schemas/Bilingual' }
        slug: { type: string }
        description: { $ref: '#/components/schemas/Bilingual' }
        category: { type: string }
        brand: { type: string }
        images: { type: array, items: { type: string } }
        mrp: { type: integer, description: 'paise' }
        price: { type: integer, description: 'paise' }
        discountPercent: { type: integer }
        unit: { type: string, example: '1 kg' }
        stock: { type: integer }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        tags: { type: array, items: { type: string } }
        isActive: { type: boolean }

    StoreSettings:
      type: object
      properties:
        deliveryFee: { type: integer, description: paise }
        freeDeliveryThreshold: { type: integer, description: paise }
        handlingFee: { type: integer, description: paise }
        minOrderValue: { type: integer, description: paise }
        storeOpen: { type: boolean }
        storeTimings:
          type: object
          properties:
            open: { type: string, example: '08:00' }
            close: { type: string, example: '22:00' }

    PincodeInput:
      type: object
      required: [pincode, areaName]
      properties:
        pincode: { type: string, example: '261001' }
        areaName: { $ref: '#/components/schemas/Bilingual' }
        isActive: { type: boolean, default: true }
        deliveryFee: { type: integer, nullable: true, description: 'paise; null = use the store delivery fee' }
        etaDays: { type: integer, default: 2, minimum: 0, maximum: 30 }

    PricingBreakdown:
      type: object
      properties:
        subtotal: { type: integer, description: 'paise' }
        discount: { type: integer, description: 'paise' }
        deliveryFee: { type: integer, description: 'paise' }
        handlingFee: { type: integer, description: 'paise' }
        total: { type: integer, description: 'paise' }

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              title: { $ref: '#/components/schemas/Bilingual' }
              image: { type: string }
              unit: { type: string }
              price: { type: integer }
              mrp: { type: integer }
              qty: { type: integer }
              isAvailable: { type: boolean }
              inStock: { type: boolean }
              lineTotal: { type: integer }
        pricing: { $ref: '#/components/schemas/PricingBreakdown' }
        couponCode: { type: string, nullable: true }
        couponError:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }

    Order:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        items: { type: array, items: { type: object } }
        pricing: { $ref: '#/components/schemas/PricingBreakdown' }
        couponCode: { type: string, nullable: true }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentMethod: { type: string, enum: [cod, upi, card, netbanking] }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded] }
        status:
          type: string
          enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled]
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              note: { type: string }
        expectedDeliveryAt: { type: string, format: date-time, nullable: true }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Client-generated unique key; retrying with the same key replays the original order.

paths:
  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send a 6-digit OTP to a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { type: string, example: '9876543210' }
                purpose: { type: string, enum: [login, signup], default: login }
      responses:
        '200': { description: OTP sent }
        '429': { description: Rate limited (3 sends / 15 min / mobile) }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP; creates the user on first login and returns tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code]
              properties:
                mobile: { type: string }
                code: { type: string, example: '482913' }
                purpose: { type: string, enum: [login, signup], default: login }
                name: { type: string, description: Used to set name on first signup }
      responses:
        '200': { description: Existing user logged in }
        '201': { description: New user created and logged in }
        '400': { description: 'OTP_INVALID | OTP_EXPIRED | OTP_MAX_ATTEMPTS | OTP_NOT_FOUND' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access + refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: New token pair issued }
        '401': { description: 'REFRESH_TOKEN_INVALID | REFRESH_TOKEN_REUSED' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: Logged out }

  /me:
    get:
      tags: [Auth]
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Auth]
      summary: Update name/email on the current user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '200': { description: OK }

  /categories:
    get:
      tags: [Catalog]
      summary: List active categories
      responses:
        '200': { description: OK }

  /banners:
    get:
      tags: [Catalog]
      summary: List active home-carousel banners
      responses:
        '200': { description: OK }

  /products:
    get:
      tags: [Catalog]
      summary: List products with filters, sort, search and pagination
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: integer } }
        - { name: maxPrice, in: query, schema: { type: integer } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: number } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, price_asc, price_desc, newest, discount] }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK — `meta.total` is the "N products" count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                      meta:
                        type: object
                        properties:
                          total: { type: integer }
                          page: { type: integer }
                          limit: { type: integer }
                          pages: { type: integer }

  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Get a single product by slug
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: PRODUCT_NOT_FOUND }

  /products/{id}/related:
    get:
      tags: [Catalog]
      summary: Get related products (same category)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: OK }

  /products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for a product
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
    post:
      tags: [Reviews]
      summary: Review a product (requires a delivered order containing it)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: REVIEW_REQUIRES_DELIVERED_ORDER }
        '409': { description: REVIEW_ALREADY_EXISTS }

  /cart:
    get:
      tags: [Cart]
      summary: Get the current user's cart with a full pricing breakdown
      description: Optional `pincode` previews that area's delivery-fee override so the total matches checkout.
      parameters:
        - { name: pincode, in: query, schema: { type: string, example: '261001' } }
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
    delete:
      tags: [Cart]
      summary: Clear the cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
                qty: { type: integer, default: 1, minimum: 1 }
      responses:
        '201': { description: Created }
        '404': { description: PRODUCT_NOT_FOUND }

  /cart/items/{productId}:
    patch:
      tags: [Cart]
      summary: Update item quantity (qty 0 removes the item)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties: { qty: { type: integer, minimum: 0 } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      security: [{ bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /cart/coupon:
    post:
      tags: [Cart]
      summary: Apply a coupon code to the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, example: AALI50 } }
      responses:
        '200': { description: OK }
        '400':
          description: >
            COUPON_INACTIVE | COUPON_EXPIRED | COUPON_NOT_STARTED | COUPON_MIN_ORDER |
            COUPON_USAGE_LIMIT_REACHED | COUPON_PER_USER_LIMIT_REACHED | CART_EMPTY
        '404': { description: COUPON_NOT_FOUND }
    delete:
      tags: [Cart]
      summary: Remove the applied coupon
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: NO_COUPON_APPLIED }

  /addresses:
    get:
      tags: [Addresses]
      summary: List the current user's saved addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Addresses]
      summary: Add a new address
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Address' }
      responses:
        '201': { description: Created }

  /addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update an address
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: ADDRESS_NOT_FOUND }
    delete:
      tags: [Addresses]
      summary: Delete an address
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /addresses/{id}/default:
    post:
      tags: [Addresses]
      summary: Mark an address as default
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /serviceability:
    get:
      tags: [Addresses]
      summary: Check whether a pincode is serviceable (reads the admin-managed pincode list)
      description: >
        Returns `{ pincode, serviceable, etaDays, areaName: {en,hi}|null, deliveryFee }` (deliveryFee in paise, null when not serviceable).
        While no pincode is configured at all, every pincode is serviceable.
      parameters: [{ name: pincode, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order from the current cart (idempotent)
      description: >
        Online methods (upi/card/netbanking) also return `data.payment` = `{ provider, keyId, providerOrderId, amount, currency }`
        for opening the Razorpay sheet (null for COD). Checkout can fail with STORE_CLOSED (503), MIN_ORDER_VALUE, NOT_SERVICEABLE (400)
        or PAYMENT_PROVIDER_ERROR (502; retry with the same Idempotency-Key).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [addressId, paymentMethod]
              properties:
                addressId: { type: string }
                paymentMethod: { type: string, enum: [cod, upi, card, netbanking] }
      responses:
        '201':
          description: Order created (or replayed if Idempotency-Key was already used)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Order' } }
        '400': { description: 'IDEMPOTENCY_KEY_REQUIRED | CART_EMPTY | OUT_OF_STOCK | INSUFFICIENT_STOCK' }
        '404': { description: ADDRESS_NOT_FOUND }
    get:
      tags: [Orders]
      summary: List the current user's orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order (with statusHistory for the tracking screen)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: ORDER_NOT_FOUND }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order (only while placed/confirmed/packed)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '200': { description: OK }
        '400': { description: ORDER_NOT_CANCELLABLE }

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Razorpay-shaped payment webhook (raw body, HMAC signature verified)
      responses:
        '200': { description: Acknowledged }
        '400': { description: PAYMENT_SIGNATURE_INVALID }

  /admin/products:
    get:
      tags: [Admin]
      summary: List products incl. inactive (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: 'substring of title (en/hi), slug, brand or tag' }
        - { name: category, in: query, schema: { type: string } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: lowStock, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'stock <= LOW_STOCK_THRESHOLD' }
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a product (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
        '403': { description: FORBIDDEN }

  /admin/products/{id}:
    patch:
      tags: [Admin]
      summary: Update a product (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
    delete:
      tags: [Admin]
      summary: Soft-delete a product (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /admin/categories:
    get:
      tags: [Admin]
      summary: List all categories incl. inactive (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a category (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/coupons:
    get:
      tags: [Admin]
      summary: List all coupons (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a coupon (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/banners:
    get:
      tags: [Admin]
      summary: List all banners incl. inactive (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a banner (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Transition an order's status (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled]
                note: { type: string }
      responses:
        '200': { description: OK }

  /admin/uploads:
    post:
      tags: [Admin]
      summary: Upload one or more product/category/banner images (multipart, field "images")
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201': { description: 'Created - returns { urls: string[] }' }

  /products/suggest:
    get:
      tags: [Catalog]
      summary: Type-ahead suggestions (prefix match, top 8)
      description: Matches the start of any title word (en/hi), brand word or tag, so "att" finds "atta". Active products only.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        '200':
          description: 'Array of { id, slug, title: {en,hi}, price (paise), image }'

  /settings:
    get:
      tags: [Catalog]
      summary: Public store settings
      description: All money in paise.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StoreSettings' } }

  /payments/verify:
    post:
      tags: [Payments]
      summary: Confirm a completed Razorpay checkout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, razorpay_payment_id, razorpay_signature]
              properties:
                orderId: { type: string, description: Our order id, not Razorpay's }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
                razorpay_order_id: { type: string, description: Optional; cross-checked against the stored provider order id }
      responses:
        '200': { description: Order with paymentStatus = paid (idempotent) }
        '400': { description: PAYMENT_SIGNATURE_INVALID | PAYMENT_NOT_REQUIRED | ORDER_NOT_PAYABLE }
        '404': { description: ORDER_NOT_FOUND }

  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard numbers (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: todayRevenue is paise; "today" is the IST day
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          todayOrders: { type: integer }
                          todayRevenue: { type: integer }
                          pendingOrders: { type: integer, description: 'placed + confirmed + packed' }
                          outForDelivery: { type: integer }
                          lowStockCount: { type: integer }
                          totalCustomers: { type: integer }

  /admin/users:
    get:
      tags: [Admin]
      summary: List customers with order counts (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: 'name or mobile, substring' }
      responses:
        '200': { description: 'Array of { id, name, mobile, email, isVerified, ordersCount, createdAt } + meta' }

  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled] } }
        - { name: from, in: query, schema: { type: string, example: '2026-11-01' }, description: 'YYYY-MM-DD (start of that IST day) or ISO datetime' }
        - { name: to, in: query, schema: { type: string, example: '2026-11-14' }, description: 'YYYY-MM-DD (end of that IST day, inclusive) or ISO datetime' }
        - { name: q, in: query, schema: { type: string }, description: 'orderNumber or customer mobile, substring' }
      responses:
        '200': { description: 'Orders with user populated as { id, name, mobile } + meta' }

  /admin/orders/{id}:
    get:
      tags: [Admin]
      summary: Get any order with the full customer card (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: ORDER_NOT_FOUND }

  /admin/settings:
    get:
      tags: [Admin]
      summary: Get store settings (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Admin]
      summary: Change store settings (admin only; at least one field)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryFee: { type: integer, description: paise }
                freeDeliveryThreshold: { type: integer, description: 'paise; delivery is free at/above this subtotal (0 = always free)' }
                handlingFee: { type: integer, description: paise }
                minOrderValue: { type: integer, description: 'paise; 0 = no minimum' }
                storeOpen: { type: boolean, description: 'false => POST /orders returns 503 STORE_CLOSED' }
                storeTimings:
                  type: object
                  properties:
                    open: { type: string, example: '08:00' }
                    close: { type: string, example: '22:00' }
      responses:
        '200': { description: OK }

  /admin/pincodes:
    get:
      tags: [Admin]
      summary: List serviceable areas (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: 'pincode or area name, substring' }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Add a serviceable area (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PincodeInput' }
      responses:
        '201': { description: Created }
        '409': { description: DUPLICATE_KEY }

  /admin/pincodes/{id}:
    patch:
      tags: [Admin]
      summary: Update a serviceable area (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: PINCODE_NOT_FOUND }
    delete:
      tags: [Admin]
      summary: Delete a serviceable area (hard delete; admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: PINCODE_NOT_FOUND }
