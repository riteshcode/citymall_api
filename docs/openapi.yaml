openapi: 3.0.3
info:
  title: Aali Market API
  description: >
    Price-first mobile shopping API for small-town India. All money fields
    are integer paise. Bilingual user-facing text is `{ en, hi }`.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Catalog
  - name: Cart
  - name: Addresses
  - name: Orders
  - name: Payments
  - name: Reviews
  - name: Rider
  - name: Push
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Bilingual:
      type: object
      properties:
        en: { type: string }
        hi: { type: string }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true, example: null }
        error:
          type: object
          properties:
            code: { type: string, example: 'OTP_EXPIRED' }
            message: { type: string }
            details: { type: array, items: { type: object }, nullable: true }

    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        error: { nullable: true, example: null }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string, example: Home }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        location:
          type: object
          description: Optional pin for the rider; both values or none. Send null on PATCH to clear.
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, example: '110001' }
        isDefault: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: string }
        title: { $ref: '#/components/schemas/Bilingual' }
        slug: { type: string }
        description: { $ref: '#/components/schemas/Bilingual' }
        category: { type: string }
        brand: { type: string }
        images: { type: array, items: { type: string } }
        mrp: { type: integer, description: 'paise' }
        price: { type: integer, description: 'paise' }
        discountPercent: { type: integer }
        unit: { type: string, example: '1 kg' }
        stock: { type: integer }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        tags: { type: array, items: { type: string } }
        isActive: { type: boolean }
        optionName:
          allOf: [{ $ref: '#/components/schemas/Bilingual' }]
          nullable: true
          description: 'What the options are called, e.g. { en: "Pack size", hi: "पैक साइज़" }. null for a product without variants.'
        variants:
          type: array
          description: >-
            Empty for a plain product. With variants, price / mrp / unit / stock above are DERIVED by the backend:
            default variant's price, mrp and (English label as) unit; stock = total of the active variants.
            Customers only receive active variants; admin endpoints return all.
          items: { $ref: '#/components/schemas/ProductVariant' }

    ProductVariant:
      type: object
      properties:
        id: { type: string }
        label: { $ref: '#/components/schemas/Bilingual' }
        sku: { type: string }
        mrp: { type: integer, description: paise }
        price: { type: integer, description: 'paise, never above mrp' }
        stock: { type: integer }
        images: { type: array, items: { type: string }, description: 'empty = use the product images' }
        isDefault: { type: boolean, description: 'exactly one per product; must be active' }
        isActive: { type: boolean }
        discountPercent: { type: integer }
        inStock: { type: boolean }

    VariantInput:
      type: object
      required: [label, mrp, price, stock]
      properties:
        id: { type: string, description: 'PATCH only: with an id the variant is updated, without one it is created' }
        label: { $ref: '#/components/schemas/Bilingual' }
        sku: { type: string }
        mrp: { type: integer }
        price: { type: integer }
        stock: { type: integer, minimum: 0 }
        images: { type: array, items: { type: string, format: uri } }
        isDefault: { type: boolean, default: false }
        isActive: { type: boolean, default: true }

    ProductInput:
      type: object
      description: >-
        mrp / price / unit / stock are required for a product WITHOUT variants. With variants (max 20; labels and skus
        unique; exactly one active default; each price <= mrp) they are ignored and derived. On PATCH every key is
        optional; `variants` is the COMPLETE list (with id = update, without = create, left out = deleted; [] = back to a
        plain product).
      properties:
        title: { $ref: '#/components/schemas/Bilingual' }
        slug: { type: string }
        description: { $ref: '#/components/schemas/Bilingual' }
        category: { type: string }
        brand: { type: string }
        images: { type: array, items: { type: string, format: uri } }
        mrp: { type: integer }
        price: { type: integer }
        unit: { type: string }
        stock: { type: integer }
        optionName:
          allOf: [{ $ref: '#/components/schemas/Bilingual' }]
          nullable: true
        variants:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/VariantInput' }
        tags: { type: array, items: { type: string } }
        isActive: { type: boolean }

    StoreSettings:
      type: object
      properties:
        storeName: { type: string, example: 'Aali Market, Sitapur' }
        phone: { type: string, example: '+91 98765 43210' }
        whatsapp: { type: string, example: '9876543210' }
        email: { type: string, example: hello@aalimarket.in }
        address:
          type: object
          properties:
            line1: { type: string }
            city: { type: string }
            state: { type: string }
            pincode: { type: string }
        fssaiNumber: { type: string, description: '14 digits, or empty' }
        gstin: { type: string, description: '15 characters, or empty' }
        deliveryFee: { type: integer, description: paise }
        freeDeliveryThreshold: { type: integer, description: paise }
        handlingFee: { type: integer, description: paise }
        minOrderValue: { type: integer, description: paise }
        storeOpen: { type: boolean }
        storeTimings:
          type: object
          properties:
            open: { type: string, example: '08:00' }
            close: { type: string, example: '22:00' }

    PincodeInput:
      type: object
      required: [pincode, areaName]
      properties:
        pincode: { type: string, example: '261001' }
        areaName: { $ref: '#/components/schemas/Bilingual' }
        isActive: { type: boolean, default: true }
        deliveryFee: { type: integer, nullable: true, description: 'paise; null = use the store delivery fee' }
        etaDays: { type: integer, default: 2, minimum: 0, maximum: 30 }
        etaMinutes: { type: integer, nullable: true, minimum: 5, maximum: 1440, description: 'quick-delivery areas: expectedDeliveryAt = order time + etaMinutes (wins over etaDays); null = use etaDays' }

    PricingBreakdown:
      type: object
      properties:
        subtotal: { type: integer, description: 'paise' }
        discount: { type: integer, description: 'paise' }
        deliveryFee: { type: integer, description: 'paise' }
        handlingFee: { type: integer, description: 'paise' }
        total: { type: integer, description: 'paise' }

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              variantId: { type: string, nullable: true, description: 'null for a product without variants' }
              variantLabel:
                allOf: [{ $ref: '#/components/schemas/Bilingual' }]
                nullable: true
              title: { $ref: '#/components/schemas/Bilingual' }
              image: { type: string }
              unit: { type: string }
              price: { type: integer }
              mrp: { type: integer }
              qty: { type: integer }
              isAvailable: { type: boolean }
              inStock: { type: boolean }
              lineTotal: { type: integer }
        pricing: { $ref: '#/components/schemas/PricingBreakdown' }
        couponCode: { type: string, nullable: true }
        couponError:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }

    Order:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        items: { type: array, items: { type: object } }
        pricing: { $ref: '#/components/schemas/PricingBreakdown' }
        couponCode: { type: string, nullable: true }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentMethod: { type: string, enum: [cod, upi, card, netbanking] }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded] }
        status:
          type: string
          enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled]
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              note: { type: string }
        expectedDeliveryAt: { type: string, format: date-time, nullable: true }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Client-generated unique key; retrying with the same key replays the original order.

paths:
  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send a 6-digit OTP to a CUSTOMER's mobile number (admin / rider mobiles use /auth/staff/login)
      description: >-
        The response includes the OTP `code` only when NODE_ENV is not production AND SMS_PROVIDER is console
        (local development). In production it never does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { type: string, example: '9876543210' }
                purpose: { type: string, enum: [login, signup], default: login }
      responses:
        '200': { description: 'OTP sent: { mobile, expiresAt, ttlMinutes } (+ code in local development only)' }
        '403': { description: 'USE_PASSWORD_LOGIN: the mobile belongs to an admin or rider; nothing was generated or sent' }
        '429': { description: Rate limited (3 sends / 15 min / mobile) }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP; creates the user on first login and returns tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code]
              properties:
                mobile: { type: string }
                code: { type: string, example: '482913' }
                purpose: { type: string, enum: [login, signup], default: login }
                name: { type: string, description: Used to set name on first signup }
      responses:
        '200': { description: Existing user logged in }
        '201': { description: New user created and logged in }
        '400': { description: 'OTP_INVALID | OTP_EXPIRED | OTP_MAX_ATTEMPTS | OTP_NOT_FOUND' }
        '403': { description: 'USE_PASSWORD_LOGIN (admin / rider mobile) | ACCOUNT_DISABLED' }

  /auth/staff/login:
    post:
      tags: [Auth]
      summary: Admin / rider sign-in with username + password
      description: >-
        Same response shape as /auth/otp/verify. A wrong password, an unknown username and a customer account all give the
        SAME 401 INVALID_CREDENTIALS. 5 wrong passwords lock the account for 15 minutes (429 ACCOUNT_LOCKED, an atomic
        counter). Failed attempts are also rate-limited per IP and per username (429 RATE_LIMITED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password }
      responses:
        '200': { description: '{ user, accessToken, refreshToken, isNewUser: false }' }
        '401': { description: INVALID_CREDENTIALS }
        '403': { description: ACCOUNT_DISABLED (only after the password was right) }
        '429': { description: 'ACCOUNT_LOCKED (details.retryAfterSeconds) | RATE_LIMITED' }

  /me/password:
    patch:
      tags: [Auth]
      summary: Change my password (admin / rider only)
      description: >-
        New password: at least 8 characters with a letter and a number (max 72 bytes), different from the current one.
        Every refresh token is revoked and access tokens issued earlier stop working; the response is a fresh token pair
        for the current session. A wrong current password counts towards the account lock.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: '{ accessToken, refreshToken, passwordChangedAt }' }
        '400': { description: 'VALIDATION_ERROR (weak / same password) | INVALID_CURRENT_PASSWORD' }
        '403': { description: FORBIDDEN (customers cannot) }
        '429': { description: ACCOUNT_LOCKED }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access + refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: New token pair issued }
        '401': { description: 'REFRESH_TOKEN_INVALID | REFRESH_TOKEN_REUSED' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: Logged out }

  /me:
    get:
      tags: [Auth]
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Auth]
      summary: Update name/email on the current user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '200': { description: OK }

  /categories:
    get:
      tags: [Catalog]
      summary: List active categories
      responses:
        '200': { description: OK }

  /banners:
    get:
      tags: [Catalog]
      summary: List active home-carousel banners
      responses:
        '200': { description: OK }

  /products:
    get:
      tags: [Catalog]
      summary: List products with filters, sort, search and pagination
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: integer } }
        - { name: maxPrice, in: query, schema: { type: integer } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: number } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, price_asc, price_desc, newest, discount] }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK — `meta.total` is the "N products" count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                      meta:
                        type: object
                        properties:
                          total: { type: integer }
                          page: { type: integer }
                          limit: { type: integer }
                          pages: { type: integer }

  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Get a single product by slug
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: PRODUCT_NOT_FOUND }

  /products/{id}/related:
    get:
      tags: [Catalog]
      summary: Get related products (same category)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: OK }

  /products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List the APPROVED reviews of a product (pending / rejected ones are never shown)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
    post:
      tags: [Reviews]
      summary: Review a product (requires a delivered order containing it); starts as pending until an admin approves it
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '201': { description: 'The review with status "pending"; the product rating does not change until it is approved' }
        '400': { description: REVIEW_REQUIRES_DELIVERED_ORDER }
        '409': { description: 'REVIEW_ALREADY_EXISTS (one review per product, whatever its status)' }

  /products/{id}/reviews/mine:
    get:
      tags: [Reviews]
      summary: The caller's own review of this product in ANY status (or null)
      description: 'Lets the product page say "Your review was sent for approval". Only `status` is shown, never the admin note.'
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'Review with status pending | approved | rejected, or data: null when the caller has not reviewed it' }
        '401': { description: UNAUTHORIZED }

  /cart:
    get:
      tags: [Cart]
      summary: Get the current user's cart with a full pricing breakdown
      description: Optional `pincode` previews that area's delivery-fee override so the total matches checkout.
      parameters:
        - { name: pincode, in: query, schema: { type: string, example: '261001' } }
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
    delete:
      tags: [Cart]
      summary: Clear the cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
                variantId: { type: string, description: 'REQUIRED for a product with variants' }
                qty: { type: integer, default: 1, minimum: 1 }
      responses:
        '201': { description: Created }
        '400': { description: 'VARIANT_REQUIRED (the product has variants; details.options lists the active ones)' }
        '404': { description: 'PRODUCT_NOT_FOUND | VARIANT_NOT_FOUND (unknown, inactive or another product''s variant)' }

  /cart/items/{productId}:
    patch:
      tags: [Cart]
      summary: Update item quantity (qty 0 removes the item)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: variantId, in: query, schema: { type: string }, description: 'the line is (product, variant): send it for a product with variants' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties: { qty: { type: integer, minimum: 0 } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: variantId, in: query, schema: { type: string }, description: 'removes only that variant''s line' }
      responses:
        '200': { description: OK }

  /cart/coupon:
    post:
      tags: [Cart]
      summary: Apply a coupon code to the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, example: AALI50 } }
      responses:
        '200': { description: OK }
        '400':
          description: >
            COUPON_INACTIVE | COUPON_EXPIRED | COUPON_NOT_STARTED | COUPON_MIN_ORDER |
            COUPON_USAGE_LIMIT_REACHED | COUPON_PER_USER_LIMIT_REACHED | CART_EMPTY
        '404': { description: COUPON_NOT_FOUND }
    delete:
      tags: [Cart]
      summary: Remove the applied coupon
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: NO_COUPON_APPLIED }

  /addresses:
    get:
      tags: [Addresses]
      summary: List the current user's saved addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Addresses]
      summary: Add a new address
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Address' }
      responses:
        '201': { description: Created }

  /addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update an address
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: ADDRESS_NOT_FOUND }
    delete:
      tags: [Addresses]
      summary: Delete an address
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /addresses/{id}/default:
    post:
      tags: [Addresses]
      summary: Mark an address as default
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /geo/reverse:
    get:
      tags: [Addresses]
      summary: Current location -> area + pincode ("Delivering to G Block, Sector 63")
      description: >-
        Public, rate-limited per IP. India only. GEO_PROVIDER=nominatim (OpenStreetMap, free: identifying User-Agent, queued
        1 request/second) or google (GOOGLE_MAPS_API_KEY). Coordinates are rounded to 3 decimals and answers cached for 24 hours.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { description: '{ pincode, area, city, state }' }
        '400': { description: VALIDATION_ERROR }
        '404': { description: 'GEO_NOT_FOUND (outside India, or no pincode found there)' }
        '429': { description: RATE_LIMITED }
        '502': { description: GEO_PROVIDER_ERROR }
        '503': { description: GEO_NOT_CONFIGURED }

  /coupons/available:
    get:
      tags: [Cart]
      summary: Offers a customer can use right now
      description: >-
        Active, inside their dates, global usage limit not used up. With a token, coupons whose per-user limit that user has
        used up are removed. An invalid / expired token is 401 (not treated as a guest). minOrderValue is shown, not filtered.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200': { description: '[{ code, type, value, minOrderValue, maxDiscount, expiresAt, description { en, hi } | null }] soonest-expiring first' }
        '401': { description: 'TOKEN_INVALID | TOKEN_EXPIRED (a token was sent but is not valid)' }

  /serviceability:
    get:
      tags: [Addresses]
      summary: Check whether a pincode is serviceable (reads the admin-managed pincode list)
      description: >
        Returns `{ pincode, serviceable, etaDays, etaMinutes, areaName: {en,hi}|null, deliveryFee }` (deliveryFee in paise, null when not serviceable;
        etaMinutes is set for quick-delivery areas, else null).
        While no pincode is configured at all, every pincode is serviceable.
      parameters: [{ name: pincode, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order from the current cart (idempotent)
      description: >
        Online methods (upi/card/netbanking) also return `data.payment` = `{ provider, keyId, providerOrderId, amount, currency }`
        for opening the Razorpay sheet (null for COD). Checkout can fail with STORE_CLOSED (503), MIN_ORDER_VALUE, NOT_SERVICEABLE (400)
        or PAYMENT_PROVIDER_ERROR (502; retry with the same Idempotency-Key).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [addressId, paymentMethod]
              properties:
                addressId: { type: string }
                paymentMethod: { type: string, enum: [cod, upi, card, netbanking] }
                deliveryNote: { type: string, maxLength: 200, description: 'Shown to the rider' }
      responses:
        '201':
          description: Order created (or replayed if Idempotency-Key was already used)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Order' } }
        '400': { description: 'IDEMPOTENCY_KEY_REQUIRED | CART_EMPTY | OUT_OF_STOCK | INSUFFICIENT_STOCK' }
        '404': { description: ADDRESS_NOT_FOUND }
    get:
      tags: [Orders]
      summary: List the current user's orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order (with statusHistory for the tracking screen)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: ORDER_NOT_FOUND }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order (only while placed/confirmed/packed)
      description: >-
        Stock goes back to the same variant, the coupon is given back, and a paid online order is refunded (refundStatus
        pending -> processed; paymentStatus "refunded" only when the refund is processed). A gateway failure never undoes the cancel.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '200': { description: OK }
        '400': { description: ORDER_NOT_CANCELLABLE }

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Razorpay-shaped payment webhook (raw body, HMAC signature verified)
      description: >-
        Payment events (payment.captured / failed) and refund events: refund.processed and refund.failed update Order.refunds
        idempotently (only a pending refund moves, once). A refund made outside this API is recorded with source "gateway".
      responses:
        '200': { description: Acknowledged }
        '400': { description: PAYMENT_SIGNATURE_INVALID }

  /admin/products:
    get:
      tags: [Admin]
      summary: List products incl. inactive (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: 'substring of title (en/hi), slug, brand or tag' }
        - { name: category, in: query, schema: { type: string } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: lowStock, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'stock <= LOW_STOCK_THRESHOLD; for a product with variants: ANY active variant at or below it' }
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a product, optionally with optionName + variants (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Created }
        '403': { description: FORBIDDEN }

  /admin/products/{id}:
    patch:
      tags: [Admin]
      summary: Update a product incl. its variants (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: OK }
        '400': { description: VALIDATION_ERROR (duplicate labels, not exactly one active default, price above mrp, more than 20 variants) }
        '404': { description: 'PRODUCT_NOT_FOUND | VARIANT_NOT_FOUND (a variant id that is not this product''s)' }
    delete:
      tags: [Admin]
      summary: Soft-delete a product (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /admin/categories:
    get:
      tags: [Admin]
      summary: List all categories incl. inactive (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a category (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/coupons:
    get:
      tags: [Admin]
      summary: List all coupons (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a coupon (admin only); optional description { en, hi } shows on the Offers screen
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/banners:
    get:
      tags: [Admin]
      summary: List all banners incl. inactive (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Create a banner (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Transition an order's status (admin only)
      description: >-
        "cancelled" does everything a customer cancel does, in one transaction and idempotently: stock goes back to the
        same variant, the coupon redemption is given back, and a paid ONLINE order is refunded through the gateway. A cancelled
        order cannot be re-opened (400 INVALID_ORDER_STATE).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled]
                note: { type: string }
      responses:
        '200': { description: OK }

  /admin/uploads:
    post:
      tags: [Admin]
      summary: Upload one or more product/category/banner images (multipart, field "images")
      security: [{ bearerAuth: [] }]
      description: >
        Streams up to 6 images (field `images`, jpeg/png/webp/avif, max 5 MB each) to Cloudinary (folder aali-market/products).
        Originals are capped at 1000x1000 and recompressed; the returned URLs carry `f_auto,q_auto` so browsers get AVIF/WebP.
        All-or-nothing; urls are in file order. STORAGE_PROVIDER=s3 switches to the legacy S3 provider.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201': { description: 'Created - returns { urls: string[] } (https://res.cloudinary.com/...)' }
        '400': { description: 'VALIDATION_ERROR (type / count / field name) | UPLOAD_FAILED (Cloudinary rejected the file)' }
        '413': { description: FILE_TOO_LARGE }
        '502': { description: UPLOAD_FAILED (storage provider error) }
        '503': { description: UPLOAD_FAILED (storage not configured) }

  /products/suggest:
    get:
      tags: [Catalog]
      summary: Type-ahead suggestions (prefix match, top 8)
      description: Matches the start of any title word (en/hi), brand word or tag, so "att" finds "atta". Active products only.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        '200':
          description: 'Array of { id, slug, title: {en,hi}, price (paise), image }'

  /settings:
    get:
      tags: [Catalog]
      summary: Public store settings
      description: All money in paise.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StoreSettings' } }

  /payments/verify:
    post:
      tags: [Payments]
      summary: Confirm a completed Razorpay checkout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, razorpay_payment_id, razorpay_signature]
              properties:
                orderId: { type: string, description: Our order id, not Razorpay's }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
                razorpay_order_id: { type: string, description: Optional; cross-checked against the stored provider order id }
      responses:
        '200': { description: Order with paymentStatus = paid (idempotent) }
        '400': { description: 'PAYMENT_SIGNATURE_INVALID | PAYMENT_NOT_REQUIRED | ORDER_NOT_PAYABLE' }
        '404': { description: ORDER_NOT_FOUND }

  /admin/orders/{id}/refund:
    post:
      tags: [Admin]
      summary: Partial or full refund of a paid online order
      description: >-
        amount (paise) defaults to everything still refundable. The amount is reserved atomically, so refunds never add up to
        more than was paid (pending refunds count). The order stays "paid" until processed refunds cover the whole amount, then
        paymentStatus becomes "refunded". The mock gateway processes at once; Razorpay answers pending and finishes through the
        refund.processed / refund.failed webhook.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: integer, minimum: 1, description: paise }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { description: 'The order as GET /admin/orders/:id shows it, with refundStatus, refundId, refundedAmount, refundedAt and refunds[]' }
        '400': { description: 'REFUND_AMOUNT_EXCEEDED (details.maxRefundable) | REFUND_NOT_ALLOWED (COD, unpaid, nothing left) | VALIDATION_ERROR' }
        '404': { description: ORDER_NOT_FOUND }
        '502': { description: REFUND_PROVIDER_ERROR }

  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard numbers (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: todayRevenue is paise; "today" is the IST day
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          todayOrders: { type: integer }
                          todayRevenue: { type: integer }
                          pendingOrders: { type: integer, description: 'placed + confirmed + packed' }
                          outForDelivery: { type: integer }
                          lowStockCount: { type: integer, description: 'active products at or below the threshold (variant products: any active variant)' }
                          totalCustomers: { type: integer }
                          pendingReviews: { type: integer, description: 'reviews waiting for approval' }

  /admin/users:
    get:
      tags: [Admin]
      summary: List customers with order counts (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: 'name or mobile, substring' }
      responses:
        '200': { description: 'Array of { id, name, mobile, email, isVerified, ordersCount, createdAt } + meta' }

  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled] } }
        - { name: from, in: query, schema: { type: string, example: '2026-11-01' }, description: 'YYYY-MM-DD (start of that IST day) or ISO datetime' }
        - { name: to, in: query, schema: { type: string, example: '2026-11-14' }, description: 'YYYY-MM-DD (end of that IST day, inclusive) or ISO datetime' }
        - { name: q, in: query, schema: { type: string }, description: 'orderNumber or customer mobile, substring' }
      responses:
        '200': { description: 'Orders with user populated as { id, name, mobile } + meta' }

  /admin/orders/{id}:
    get:
      tags: [Admin]
      summary: Get any order with the full customer card (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: ORDER_NOT_FOUND }

  /admin/settings:
    get:
      tags: [Admin]
      summary: Get store settings (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Admin]
      summary: Change store settings (admin only; at least one field)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryFee: { type: integer, description: paise }
                freeDeliveryThreshold: { type: integer, description: 'paise; delivery is free at/above this subtotal (0 = always free)' }
                handlingFee: { type: integer, description: paise }
                minOrderValue: { type: integer, description: 'paise; 0 = no minimum' }
                storeOpen: { type: boolean, description: 'false => POST /orders returns 503 STORE_CLOSED' }
                storeTimings:
                  type: object
                  properties:
                    open: { type: string, example: '08:00' }
                    close: { type: string, example: '22:00' }
      responses:
        '200': { description: OK }

  /admin/pincodes:
    get:
      tags: [Admin]
      summary: List serviceable areas (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: 'pincode or area name, substring' }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: OK }
    post:
      tags: [Admin]
      summary: Add a serviceable area (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PincodeInput' }
      responses:
        '201': { description: Created }
        '409': { description: DUPLICATE_KEY }

  /admin/pincodes/{id}:
    patch:
      tags: [Admin]
      summary: Update a serviceable area (admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: PINCODE_NOT_FOUND }
    delete:
      tags: [Admin]
      summary: Delete a serviceable area (hard delete; admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: PINCODE_NOT_FOUND }

  /orders/{id}/payment:
    post:
      tags: [Orders]
      summary: Pay again - creates a fresh gateway order for an unpaid online order
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ payment: { provider, keyId, providerOrderId, amount, currency } }' }
        '400': { description: 'PAYMENT_NOT_RETRYABLE (COD, paid, cancelled)' }
        '404': { description: ORDER_NOT_FOUND }
        '502': { description: PAYMENT_PROVIDER_ERROR }

  /orders/{id}/payment-method:
    patch:
      tags: [Orders]
      summary: Switch an unpaid online order to cash on delivery
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties: { paymentMethod: { type: string, enum: [cod] } }
      responses:
        '200': { description: The order (owner view incl. deliveryOtp) with payment null }
        '400': { description: PAYMENT_METHOD_NOT_CHANGEABLE }

  /orders/{id}/reorder:
    post:
      tags: [Orders]
      summary: Buy again - add a past order's items to the cart
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: >
            { cart (same shape as GET /cart), skipped: [{ productId, variantId, variantLabel, title, reason, requested, added }] };
            reason is inactive | out_of_stock | qty_reduced. Variants are kept (a variant that was removed or switched off
            is skipped as inactive). Prices are today's; quantities never exceed the variant's stock.
        '404': { description: ORDER_NOT_FOUND }

  /push/vapid-public-key:
    get:
      tags: [Push]
      summary: VAPID public key for pushManager.subscribe()
      responses:
        '200': { description: '{ publicKey }' }
        '503': { description: PUSH_NOT_CONFIGURED }

  /me/push-subscriptions:
    post:
      tags: [Push]
      summary: Register the browser's PushSubscription (customer or rider token)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, description: 'https URL of a known browser push service' }
                expirationTime: { type: number, nullable: true }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string, description: base64url, 65 bytes }
                    auth: { type: string, description: base64url, 16 bytes }
      responses:
        '201': { description: '{ id, endpoint, createdAt }' }
        '400': { description: VALIDATION_ERROR (bad shape or unsupported push service) }
        '503': { description: PUSH_NOT_CONFIGURED }
    delete:
      tags: [Push]
      summary: Remove a push subscription
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties: { endpoint: { type: string } }
      responses:
        '200': { description: '{ removed: 0 | 1 }' }

  /rider/orders:
    get:
      tags: [Rider]
      summary: Orders assigned to the signed-in rider
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [placed, confirmed, packed, shipped, out_for_delivery, delivered, cancelled] } }
      responses:
        '200': { description: 'Orders with user { name, mobile }; never includes deliveryOtp' }
        '403': { description: 'FORBIDDEN (not a rider) | ACCOUNT_DISABLED' }

  /rider/orders/{id}/out-for-delivery:
    patch:
      tags: [Rider]
      summary: Mark an assigned order out for delivery
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '400': { description: INVALID_ORDER_STATE }
        '404': { description: ORDER_NOT_FOUND (also for other riders' orders) }

  /rider/orders/{id}/deliver:
    post:
      tags: [Rider]
      summary: Complete a delivery with the customer's 4-digit OTP
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, pattern: '^[0-9]{4}$', description: A string - leading zeros matter }
                cashCollected: { type: integer, description: 'paise; required for unpaid COD, not allowed otherwise' }
      responses:
        '200': { description: 'Delivered (COD becomes paid, cashCollected saved)' }
        '400': { description: 'INVALID_DELIVERY_OTP (details.attemptsLeft) | INVALID_ORDER_STATE | VALIDATION_ERROR' }
        '429': { description: DELIVERY_OTP_LOCKED }

  /admin/orders/latest:
    get:
      tags: [Admin]
      summary: New-order alert (poll with the newest createdAt you have seen)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time }, description: 'ISO datetime with zone; exclusive' }
      responses:
        '200': { description: '{ count, orders: [{ id, orderNumber, total, createdAt }] } - newest 10' }

  /admin/orders/{id}/assign:
    patch:
      tags: [Admin]
      summary: Assign (or unassign with null) a delivery rider; the rider(s) concerned get a web push
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId]
              properties: { riderId: { type: string, nullable: true } }
      responses:
        '200':
          description: >-
            Order with rider { id, name, mobile }. Push (fire-and-forget): the new rider gets
            { title: "New delivery / नई डिलीवरी", body: "#<last 6 of orderNumber>, <area or city>", url: "/rider" };
            the previous rider (given to someone else, or unassigned) gets { title: "Order reassigned / ऑर्डर बदला गया", ... }.
            Same rider again = no push. Never the customer's phone or the delivery OTP.
        '400': { description: 'ORDER_NOT_ASSIGNABLE (delivered / cancelled order, inactive rider)' }
        '404': { description: 'ORDER_NOT_FOUND | RIDER_NOT_FOUND' }

  /admin/riders:
    get:
      tags: [Admin]
      summary: List delivery riders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: 'Array of { id, name, mobile, username (null for older riders), isActive, activeOrders, createdAt } + meta; q also matches the username' }
    post:
      tags: [Admin]
      summary: Create a rider (they sign in with username + password; the mobile is for calls and push)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mobile, username, password]
              properties:
                name: { type: string }
                mobile: { type: string, example: '9877700001' }
                username: { type: string, example: ramesh.kumar, description: '3-30 characters: a-z 0-9 . _ (lower-cased)' }
                password: { type: string, format: password, minLength: 8, description: 'a letter and a number' }
                isActive: { type: boolean, default: true }
      responses:
        '201': { description: Created (no password hash is ever returned) }
        '400': { description: VALIDATION_ERROR }
        '409': { description: 'MOBILE_ALREADY_REGISTERED | USERNAME_TAKEN' }

  /admin/riders/{id}:
    patch:
      tags: [Admin]
      summary: Update a rider (name, mobile, isActive)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: RIDER_NOT_FOUND }
        '409': { description: MOBILE_ALREADY_REGISTERED }

  /admin/reports/sales:
    get:
      tags: [Admin]
      summary: Sales per period (IST; cancelled and failed/refunded payments excluded)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string }, description: 'YYYY-MM-DD or ISO; default 30 days before `to`' }
        - { name: to, in: query, schema: { type: string }, description: 'YYYY-MM-DD (inclusive) or ISO; default today' }
        - { name: groupBy, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200': { description: '[{ period, orders, revenue (paise), avgOrderValue (paise) }]; period is YYYY-MM-DD (day; week = its Monday) or YYYY-MM' }

  /admin/reports/top-products:
    get:
      tags: [Admin]
      summary: Best-selling products
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: '[{ productId, variantId, variantLabel {en,hi}, title {en,hi}, qtySold, revenue (paise, before coupons) }] - one row per variant; variantId / variantLabel are null for products without variants' }

  /admin/reports/cod:
    get:
      tags: [Admin]
      summary: Cash-on-delivery reconciliation for one IST day
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, example: '2026-11-18' } }
      responses:
        '200': { description: '{ date, totalExpected, totalCollected, byRider: [{ rider {id,name,mobile}|null, orders, expected, collected }] }' }

  /admin/products/bulk:
    patch:
      tags: [Admin]
      summary: Bulk update price / mrp / stock / isActive (max 200 rows), per product or per variant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 200
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  variantId: { type: string, description: 'change this variant instead of the product (the product price / mrp / stock / unit are re-derived)' }
                  price: { type: integer }
                  mrp: { type: integer }
                  stock: { type: integer }
                  isActive: { type: boolean }
      responses:
        '200': { description: '{ updated, failed: [{ id, variantId?, error }] } - valid rows are applied even if others fail. On a product with variants a row without variantId may only send isActive; a variant row cannot switch the default variant off.' }

  /admin/products/export:
    get:
      tags: [Admin]
      summary: Download all products as CSV
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'text/csv (UTF-8 with BOM); columns id, variant_id, variant_label_en, variant_label_hi, sku, slug, title_en, title_hi, option_name_en, option_name_hi, category_slug, brand, unit, mrp, price, stock, isActive; one row per product, or per variant for a product with variants; money in paise'
          content:
            text/csv:
              schema: { type: string }

  /admin/products/import:
    post:
      tags: [Admin]
      summary: Create / update products and variants from a CSV in the export format
      description: >-
        A row with variant_id or variant_label_en/hi targets one variant (found by id, else by English label, else created;
        a new variant needs both labels, mrp, price, stock and the product's option_name_en/hi; the first variant of a new
        product becomes the default). The CSV never deletes variants. Files in the old layout (no variant columns) still work.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dryRun, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' }, description: 'true validates and counts without writing' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: '.csv, max 2 MB, max 2000 rows' }
      responses:
        '200': { description: '{ created, updated, errors: [{ row (header = 1), error }], dryRun }' }
        '400': { description: 'VALIDATION_ERROR (not a csv, unknown column, no slug column, too many rows)' }
        '413': { description: FILE_TOO_LARGE }

  /admin/reviews:
    get:
      tags: [Admin]
      summary: All reviews (moderation)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: productId, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] }, description: 'default: every status' }
      responses:
        '200': { description: 'Reviews (status, moderatedAt, moderationNote) with user { name, mobile } and product { title, slug } + meta' }

  /admin/reviews/{id}/status:
    patch:
      tags: [Admin]
      summary: Approve or reject a review (can be changed again later)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                note: { type: string, minLength: 1, maxLength: 300, description: 'internal moderation note (never shown to customers)' }
      responses:
        '200': { description: '{ review (with user, product), product: { id, ratingAvg, ratingCount } } - the rating is recomputed from approved reviews' }
        '400': { description: VALIDATION_ERROR }
        '404': { description: REVIEW_NOT_FOUND }

  /admin/reviews/{id}:
    delete:
      tags: [Admin]
      summary: Delete a review and recalculate the product rating
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ id, product: { id, ratingAvg, ratingCount } }' }
        '404': { description: REVIEW_NOT_FOUND }
